name: checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional TextFold test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python3 -m pip install -r vendor/textfold/requirements-lock.txt
      - run: node scripts/build.mjs
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: node --test integrations/dsh/test/*.test.mjs
      - run: python3 tests/research-worker.test.py
      - run: python3 -m unittest discover -s tests -p package_portable_test.py
